[package]
name = "matrix-archiver"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local incremental archiving of Matrix rooms"
repository = "https://github.com/andrewrabert/matrix-archiver"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
matrix-sdk = "0.17"
regex = "1"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
strip = true
